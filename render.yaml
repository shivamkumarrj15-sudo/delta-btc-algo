services:
  - type: web
    name: delta-btc-algo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DELTA_ENV
        value: india
      - key: TRADING_MODE
        value: paper

